dump_dir: tests/ptests
depth: 1
binary: eza
gen_binary: target/debug/eza
args: tests/test_dir
commands:
  ? - null # Meta options
    - --help
  :
  ? - null
    - --version
  :
  ? - -1 # Display Options
    - --oneline
  :
  ? - -l
    - --long
  :
  ? - -g
    - --long-no-owner
  :
  ? - -o
    - --long-no-group
  :
  ? - -n
    - --numeric-uid-gid
  :
  ? - null
    - --grid
  :
  ? - -C
    - --format-columns
  :
  ? - -x
    - --across
  :
  ? - -R
    - --recurse
  :
  ? - null
    - --tree
  :
  ? - -L
    - --dereference
  :
  ? - -F
    - --classify
  :
  ? - null # -F takes no value
    - --classify
  : values:
      - auto
      - always
      - never
  ? - null
    - --color
  : values:
      - auto
      - always
      - never
  ? - null
    - --colour
  : values:
      - auto
      - always
      - never
  ? - null
    - --icons
  :
  ? - null
    - --icons
  : values:
      - auto
      - always
      - never
  ? - null
    - --no-quotes
  :
  ? - null
    - --hyperlink
  :
  ? - null
    - --hyperlink
  : values:
      - auto
      - always
      - never
  ? - null
    - --absolute
  : values:
      - on
      - follow
      - off
  ? - -w
    - --width
  : values:
      - 15
      - 30
      - 200
  ? - null
    - --smart-group
  :
  ? - -a # Filtering and Sorting Options
    - --all
  :
  ? - -A
    - --almost-all
  :
  ? - -d
    - --treat-dirs-as-files
  :
  ? - null
    - --treat-dirs-as-files
  :
  ? - null
    - --directory
  :
  ? - null # Hidden alias
    - --level
  : prefix: --tree
    values:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
  ? - -r
    - --reverse
  :
  ? - null
    - --sort
  : long: time-style
    prefix: -l
    values: # non-deterministic results with our setup (tests/test_dir) are commented out 
      # - accessed
      # - age
      # - changed
      # - created
      # - date
      - Ext
      - ext
      - Extension
      - extension
      - Filename
      - filename
      # - inode
      # - modified
      - Name
      - name
      # - newest
      # - none
      # - oldest
      # - size
      # - time
      - type
      - version
  ? - -X
    - --sort-extension
  : prefix: -l
  ? - -v
    - --sort-version
  : prefix: -l
  # -t -S -U -f -c -u sort by time, size or directory order, which is non-deterministic with our setup
  ? - null
    - --group-directories-first
  :
  ? - null
    - --group-directories-last
  :
  ? - null
    - --only-dirs
  :
  ? - null
    - --only-files
  :
  ? - null
    - --only-files
  :
  ? - -I # TODO: add more globs
    - --ignore-glob
  : prefix: -l
    values:
      - "*.toml"
  ? - null
    - --ignore
  : prefix: -l
    values:
      - "*.toml"
  ? - -B
    - --ignore-backups
  :
  ? - null
    - --git-ignore
  :
  ? - -h # Long View Options
    - --human-readable
  : prefix: -l
  ? - null
    - --binary
  :
  ? - null
    - --bytes
  :
  ? - null
    - --group
  :
  ? - -G
    - --no-group
  : prefix: -l
  ? - null
    - --header
  :
  ? - null
    - --links
  :
  ? - -i
    - --inode
  :
  ? - null # --loc/--code take modes via `=` only, so just the bare forms
    - --loc
  : prefix: -l
  ? - null
    - --code
  :
  ? - null
    - --modified
  :
  ? - -M
    - --mounts
  :
  ? - null
    - --numeric
  :
  ? - -s
    - --size
  : prefix: -l
  ? - null
    - --blocksize
  :
  ? - null
    - --time
  : prefix: -l
    values:
      - modified
      #- accessed BROKEN
      #- changed
      #- created
  ? - null
    - --accessed
  :
  ? - null
    - --created
  :
  ? - null
    - --changed
  :
  ? - null
    - --time-style
  : long: time-style
    values:
      - default
      - iso
      - long-iso
      - full-iso
      - relative
  ? - null
    - --total-size
  :
  ? - null
    - --no-permissions
  :
  ? - null
    - --octal-permissions
  :
  ? - null
    - --no-filesize
  :
  ? - null
    - --no-user
  :
  ? - null
    - --git
  :
  ? - null
    - --no-git
  :
  ? - null
    - --git-repos
  :
  ? - -@
    - --extended
  :
  ? - -Z
    - --context
  :
